# Production stack for Moskee.
#
#   docker compose up -d
#   docker compose --profile tools run --rm migrate   # prisma migrate deploy
#   docker compose --profile tools run --rm migrate pnpm db:seed
#
# All settings come from /srv/moskee/.env (see .env.production.example).

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moskee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-moskee}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moskee} -d ${POSTGRES_DB:-moskee}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persisted uploads, also served directly by Caddy.
      - ./uploads:/app/public/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-off commands (migrations / seed). Not started by `up`.
  migrate:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: pnpm db:deploy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
